name: Download Dukascopy Tick Data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (BTCUSD, EURUSD, GBPUSD, USDJPY, XAUUSD)"
        required: true
        default: "BTCUSD"

      from:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2017-01-01"

      to:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-09-01"

permissions:
  contents: write

jobs:

  # ============================================================
  # 1) Prepare
  # ============================================================

  prepare:
    runs-on: ubuntu-latest

    outputs:
      instrument: ${{ steps.meta.outputs.instrument }}
      instrument_upper: ${{ steps.meta.outputs.instrument_upper }}
      from_date: ${{ steps.meta.outputs.from_date }}
      to_date: ${{ steps.meta.outputs.to_date }}
      years: ${{ steps.meta.outputs.years }}

    steps:

      - name: Prepare inputs and year list
        id: meta
        shell: bash

        env:
          RAW_INSTRUMENT: ${{ inputs.instrument }}
          RAW_FROM: ${{ inputs.from }}
          RAW_TO: ${{ inputs.to }}

        run: |
          set -euo pipefail

          INSTRUMENT=$(printf '%s' "$RAW_INSTRUMENT" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d '[:space:]')

          INSTRUMENT_LOWER=$(printf '%s' "$INSTRUMENT" \
            | tr '[:upper:]' '[:lower:]')

          FROM_DATE=$(printf '%s' "$RAW_FROM" | cut -d' ' -f1)
          TO_DATE=$(printf '%s' "$RAW_TO" | cut -d' ' -f1)

          # ------------------------------------------------------
          # Validate dates
          # ------------------------------------------------------

          if ! date -d "$FROM_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid from date: $FROM_DATE"
            exit 1
          fi

          if ! date -d "$TO_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid to date: $TO_DATE"
            exit 1
          fi

          FROM_TS=$(date -d "$FROM_DATE" +%s)
          TO_TS=$(date -d "$TO_DATE" +%s)

          if [ "$FROM_TS" -gt "$TO_TS" ]; then
            echo "ERROR: from date is after to date"
            exit 1
          fi

          FROM_YEAR=$(date -d "$FROM_DATE" +%Y)
          TO_YEAR=$(date -d "$TO_DATE" +%Y)

          # ------------------------------------------------------
          # Build JSON year array
          # ------------------------------------------------------

          YEARS="["
          FIRST=1

          for ((y=FROM_YEAR; y<=TO_YEAR; y++)); do

            if [ "$FIRST" -eq 1 ]; then
              YEARS="${YEARS}\"${y}\""
              FIRST=0
            else
              YEARS="${YEARS},\"${y}\""
            fi

          done

          YEARS="${YEARS}]"

          echo "================================"
          echo "Instrument: $INSTRUMENT"
          echo "Dukascopy symbol: $INSTRUMENT_LOWER"
          echo "Overall From: $FROM_DATE"
          echo "Overall To:   $TO_DATE"
          echo "Years: $YEARS"
          echo "================================"

          echo "instrument=$INSTRUMENT_LOWER" >> "$GITHUB_OUTPUT"
          echo "instrument_upper=$INSTRUMENT" >> "$GITHUB_OUTPUT"
          echo "from_date=$FROM_DATE" >> "$GITHUB_OUTPUT"
          echo "to_date=$TO_DATE" >> "$GITHUB_OUTPUT"
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2) Download one year
  # ============================================================

  download-year:
    needs: prepare

    runs-on: ubuntu-latest

    timeout-minutes: 350

    strategy:
      fail-fast: false

      matrix:
        year: ${{ fromJson(needs.prepare.outputs.years) }}

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================================
      # Calculate year range
      # ==========================================================

      - name: Calculate year range
        id: range
        shell: bash

        env:
          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}
          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}
          YEAR: ${{ matrix.year }}

        run: |
          set -euo pipefail

          YEAR_START="${YEAR}-01-01"

          YEAR_END=$(date \
            -d "${YEAR}-01-01 +1 year" \
            +%Y-%m-%d)

          # ------------------------------------------------------
          # Start date
          # ------------------------------------------------------

          if [ "$(date -d "$OVERALL_FROM" +%Y)" -eq "$YEAR" ]; then
            FROM_DATE="$OVERALL_FROM"
          else
            FROM_DATE="$YEAR_START"
          fi

          # ------------------------------------------------------
          # End date
          # ------------------------------------------------------

          if [ "$(date -d "$OVERALL_TO" +%Y)" -eq "$YEAR" ]; then
            TO_DATE="$OVERALL_TO"
          else
            TO_DATE="$YEAR_END"
          fi

          # ------------------------------------------------------
          # Safety check
          # ------------------------------------------------------

          if [ "$(date -d "$FROM_DATE" +%s)" -gt "$(date -d "$TO_DATE" +%s)" ]; then
            echo "ERROR: Invalid range"
            exit 1
          fi

          INSTRUMENT="${{ needs.prepare.outputs.instrument }}"
          INSTRUMENT_UPPER="${{ needs.prepare.outputs.instrument_upper }}"

          SLUG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"

          echo "================================"
          echo "Year: $YEAR"
          echo "From: $FROM_DATE"
          echo "To: $TO_DATE"
          echo "Slug: $SLUG"
          echo "================================"

          echo "from_date=$FROM_DATE" >> "$GITHUB_OUTPUT"
          echo "to_date=$TO_DATE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "instrument=$INSTRUMENT" >> "$GITHUB_OUTPUT"
          echo "instrument_upper=$INSTRUMENT_UPPER" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # Download
      #
      # download.py fetches one hour per request from the jetta
      # API, retries failed/empty responses, and prints one
      # progress line per 6-hour chunk plus explicit empty/failed
      # hour lines, e.g.:
      #   chunk: 2018-07-12 00:00:00.000 -> 2018-07-12 06:00:00.000 | ticks: 17784 | total: 12097760 | 52%
      #   empty: 2018-07-12 06:00:00.000 | server returned no ticks (6 attempts)
      # ==========================================================

      - name: Download ticks
        shell: bash

        run: |
          set -euo pipefail

          mkdir -p download

          echo "Downloading Dukascopy tick data..."

          echo "${{ steps.range.outputs.from_date }} -> ${{ steps.range.outputs.to_date }}"

          python download.py \
            --instrument "${{ steps.range.outputs.instrument_upper }}" \
            --from-date "${{ steps.range.outputs.from_date }}" \
            --to-date "${{ steps.range.outputs.to_date }}" \
            -o "download/${{ steps.range.outputs.slug }}.raw.csv"


      # ==========================================================
      # Find CSV
      # ==========================================================

      - name: Find downloaded CSV
        shell: bash

        run: |
          set -euo pipefail

          echo "Downloaded files:"

          find download -type f -print || true

          CSV_FILE=$(find download -type f -name "*.csv" | head -n 1)

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: No CSV file found."
            exit 1
          fi

          echo "CSV: $CSV_FILE"

          ls -lh "$CSV_FILE"


      # ==========================================================
      # Convert
      # ==========================================================

      - name: Convert CSV to JForex format
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT_FILE="${{ steps.range.outputs.slug }}.csv"

          python convert.py download/*.csv -o "$OUTPUT_FILE"

          ls -lh "$OUTPUT_FILE"


      # ==========================================================
      # Fill missing hours from the classic bi5 feed
      #
      # The jetta API occasionally returns empty hours that the
      # older datafeed.dukascopy.com bi5 feed still has. This
      # step is best-effort; gapcheck below validates the result.
      # ==========================================================

      - name: Fill missing hours from bi5 feed
        shell: bash

        run: |
          set -euo pipefail

          python fill_gaps.py \
            "${{ steps.range.outputs.slug }}.csv" \
            --instrument "${{ steps.range.outputs.instrument_upper }}"


      # ==========================================================
      # Gap check (missing hours / days)
      #
      # Fails this job if any significant gap is found, so an
      # incomplete release is never published. To recover, use
      # "Re-run failed jobs" in the Actions tab.
      # ==========================================================

      - name: Check for missing hours
        shell: bash

        run: |
          set -euo pipefail

          python gapcheck.py \
            "${{ steps.range.outputs.slug }}.csv" \
            --from-date "${{ steps.range.outputs.from_date }}" \
            --to-date "${{ steps.range.outputs.to_date }}"


      # ==========================================================
      # ZIP
      # ==========================================================

      - name: Zip CSV
        shell: bash

        run: |
          set -euo pipefail

          CSV_FILE="${{ steps.range.outputs.slug }}.csv"
          ZIP_FILE="${{ steps.range.outputs.slug }}.zip"

          if [ ! -f "$CSV_FILE" ]; then
            echo "ERROR: CSV file not found."
            exit 1
          fi

          zip -9 -j "$ZIP_FILE" "$CSV_FILE"

          ls -lh "$ZIP_FILE"


      # ==========================================================
      # Split if larger than 1.9GB
      # ==========================================================

      - name: Split ZIP if larger than 1.9GB
        shell: bash

        run: |
          set -euo pipefail

          FILE="${{ steps.range.outputs.slug }}.zip"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          LIMIT=$((1900 * 1024 * 1024))

          echo "ZIP size: $SIZE bytes"
          echo "Limit: $LIMIT bytes"

          if [ "$SIZE" -gt "$LIMIT" ]; then

            echo "ZIP is larger than 1.9GB."
            echo "Splitting..."

            split -b 1900M "$FILE" "${FILE}."

            rm "$FILE"

            echo "Created parts:"
            ls -lh "${FILE}".*

          else

            echo "ZIP is smaller than 1.9GB."

          fi


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.range.outputs.slug }}

          name: "${{ steps.range.outputs.instrument_upper }} ticks ${{ steps.range.outputs.from_date }} to ${{ steps.range.outputs.to_date }}"

          generate_release_notes: false

          files: |
            ./${{ steps.range.outputs.slug }}.zip
            ./${{ steps.range.outputs.slug }}.zip.*


  # ============================================================
  # 3) Send releases to Telegram
  #
  # Downloads run in parallel.
  #
  # Telegram messages are sent sequentially:
  #
  # 2020
  # 2021
  # 2022
  # 2023
  # ...
  #
  # This job starts only after ALL download jobs finish.
  #
  # Telegram is OPTIONAL: if the TELEGRAM_BOT_TOKEN /
  # TELEGRAM_CHAT_ID secrets are not configured, this job
  # exits successfully without failing the workflow run.
  # ============================================================

  send-to-telegram:

    needs:
      - prepare
      - download-year

    runs-on: ubuntu-latest

    steps:

      - name: Send releases to Telegram in chronological order
        shell: bash

        env:

          GH_TOKEN: ${{ github.token }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}

          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}

          INSTRUMENT: ${{ needs.prepare.outputs.instrument }}

          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}

        run: |
          set -euo pipefail

          # ======================================================
          # Check Telegram settings (optional)
          # ======================================================

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then

            echo "Telegram secrets not configured."
            echo "Skipping Telegram notifications (releases are already published)."

            exit 0

          fi


          # ======================================================
          # Calculate years
          # ======================================================

          FROM_YEAR=$(date -d "$OVERALL_FROM" +%Y)

          TO_YEAR=$(date -d "$OVERALL_TO" +%Y)

          echo "=========================================="
          echo "Starting Telegram sending"
          echo "Instrument: $INSTRUMENT_UPPER"
          echo "From year: $FROM_YEAR"
          echo "To year: $TO_YEAR"
          echo "=========================================="


          # ======================================================
          # Send one year at a time
          # ======================================================

          for ((YEAR=FROM_YEAR; YEAR<=TO_YEAR; YEAR++)); do

            echo ""
            echo "=========================================="
            echo "Processing year: $YEAR"
            echo "=========================================="


            # ----------------------------------------------------
            # Calculate yearly range
            # ----------------------------------------------------

            YEAR_START="${YEAR}-01-01"

            YEAR_END=$(date \
              -d "${YEAR}-01-01 +1 year" \
              +%Y-%m-%d)


            # ----------------------------------------------------
            # Start date
            # ----------------------------------------------------

            if [ "$YEAR" -eq "$FROM_YEAR" ]; then
              FROM_DATE="$OVERALL_FROM"
            else
              FROM_DATE="$YEAR_START"
            fi


            # ----------------------------------------------------
            # End date
            # ----------------------------------------------------

            if [ "$YEAR" -eq "$TO_YEAR" ]; then
              TO_DATE="$OVERALL_TO"
            else
              TO_DATE="$YEAR_END"
            fi


            # ----------------------------------------------------
            # Release tag
            # ----------------------------------------------------

            TAG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"

            ASSET_NAME="${TAG}.zip"


            echo "From: $FROM_DATE"
            echo "To:   $TO_DATE"
            echo "Tag:  $TAG"


            # ====================================================
            # Check Release
            # ====================================================

            if ! gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

              echo "ERROR: Release not found: $TAG"

              exit 1

            fi


            # ====================================================
            # Get Release JSON
            # ====================================================

            RELEASE_JSON=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")


            # ====================================================
            # Build caption + inline keyboard
            #
            # Handles both cases:
            #   - single ZIP asset -> one DOWNLOAD button
            #   - split ZIP        -> one button per part, caption
            #     shows total size and part count
            #
            # Writes caption.txt and keyboard.json
            # ====================================================

            echo "$RELEASE_JSON" | python3 -c '
          import sys
          import json

          target = sys.argv[1]
          instrument = sys.argv[2]
          from_date = sys.argv[3]
          to_date = sys.argv[4]

          data = json.load(sys.stdin)
          assets = data.get("assets", [])

          single = None
          parts = []

          for asset in assets:
              name = asset.get("name", "")
              if name == target:
                  single = asset
              elif name.startswith(target + "."):
                  parts.append(asset)

          parts.sort(key=lambda a: a.get("name", ""))

          if single is None and not parts:
              print("ERROR: No ZIP or split parts found.", file=sys.stderr)
              sys.exit(1)

          buttons = []

          if single is not None:
              total_size = single.get("size", 0)
              buttons.append([{
                  "text": "⬇️ DOWNLOAD",
                  "url": single.get("browser_download_url", ""),
              }])
          else:
              total_size = sum(p.get("size", 0) for p in parts)
              for i, part in enumerate(parts, start=1):
                  buttons.append([{
                      "text": "⬇️ DOWNLOAD PART %d" % i,
                      "url": part.get("browser_download_url", ""),
                  }])

          size_mb = "%.2f" % (total_size / 1024 / 1024)

          caption = (
              "<b>📦 %s Tick Data</b>\n"
              "━━━━━━━━━━━━━━━━\n"
              "📅 %s → %s\n"
              "💾 Size: %s MB"
              % (instrument, from_date, to_date, size_mb)
          )

          if parts:
              caption += "\n🧩 Parts: %d" % len(parts)

          with open("caption.txt", "w") as f:
              f.write(caption)

          with open("keyboard.json", "w") as f:
              json.dump({"inline_keyboard": buttons}, f, ensure_ascii=False)
          ' "$ASSET_NAME" "$INSTRUMENT_UPPER" "$FROM_DATE" "$TO_DATE"


            CAPTION=$(cat caption.txt)

            KEYBOARD=$(cat keyboard.json)


            # ====================================================
            # Send Telegram message
            # ====================================================

            echo ""

            echo "Sending $YEAR to Telegram..."


            RESPONSE=$(curl -fsS \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              "{{https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}}}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "reply_markup=${KEYBOARD}")


            echo "$RESPONSE"


            # ====================================================
            # Check Telegram response
            # ====================================================

            if ! echo "$RESPONSE" | grep -q '"ok":true'; then

              echo "ERROR: Telegram failed for year $YEAR."

              exit 1

            fi


            echo "SUCCESS: $YEAR sent to Telegram."


            # ====================================================
            # Delay
            # ====================================================

            sleep 2

          done


          echo ""

          echo "=========================================="
          echo "ALL YEARS SENT SUCCESSFULLY"
          echo "=========================================="
